version: '3.8'
services:
  postgres:
    image: postgres:15
    container_name: travel-postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: travel_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7
    container_name: travel-redis
    ports:
      - '6379:6379'

volumes:
  postgres_data:

