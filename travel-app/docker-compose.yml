version: '3.8'
services:
  postgres:
    image: postgres:15
    container_name: travel-postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: travel_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend-network
  redis:
    image: redis:7
    container_name: travel-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - backend-network

  rabbitmq:
    image: rabbitmq:3.11-management-alpine
    container_name: travel-rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672" # RabbitMQ Management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - backend-network


volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:

networks:
  backend-network:
    driver: bridge
